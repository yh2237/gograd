name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      # The software rasterizer is what a runner without a GPU uses. It
      # exercises the DirectML paths that a hardware adapter handles
      # differently.
      - name: test (directml software adapter)
        if: matrix.os == 'windows-latest'
        env:
          GOGRAD_DIRECTML_SOFTWARE: "1"
        run: go test ./directml
      - name: gofmt
        shell: bash
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "unformatted files:"
            echo "$files"
            exit 1
          fi
